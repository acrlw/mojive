site_name: Mojive
site_description: Backend-neutral 3D viewer and renderer for robotics and simulation
site_url: https://acrlw.github.io/mojive/
repo_url: https://github.com/acrlw/mojive
repo_name: acrlw/mojive
docs_dir: docs
theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Reference:
      - Command line: reference/cli.md
      - Configuration: reference/configuration.md
  - Tutorials:
      - Tutorial map: guides/examples.md
      - Programmatic scene: tutorials/programmatic-scene.md
      - MuJoCo rendering: tutorials/mujoco-rendering.md
      - Remote viewing and replay: tutorials/remote-viewing.md
  - How-to guides:
      - Custom scene adapter: how-to/custom-adapter.md
      - Debug drawing: how-to/debug-draw.md
      - Local RPC control: how-to/rpc-control.md
      - Editor and MJCF: guides/editor-and-mjcf.md
      - Testing: guides/testing.md
      - WebGPU backend: WGPU_BACKEND_REPORT.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Renderer: RENDERER.md
      - Batch rendering for RL: BATCH_RENDERING.md
      - Platform support: PLATFORM.md
  - API reference:
      - API map: api/index.md
      - Public package exports: api/public.md
      - Scene contracts: api/scene.md
      - Adapters and session: api/adapters.md
      - Adapter implementations: api/implementations.md
      - Viewer composition: api/application.md
      - Renderer and debug draw: api/rendering.md
      - Remote and recording: api/remote.md
      - Scene and workspace files: api/io.md
      - Math and persistence: api/utilities.md
  - Engineering decisions: DECISIONS.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            filters: ["!^_"]
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_source: false
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - tables
strict: true
