[project]
name = "forge-viewer"
version = "0.1.0"
description = "机器人仿真场景查看器，核心是自研现代 OpenGL 渲染器 forge"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "moderngl>=5.10",
    "glfw>=2.7",
    "imgui-bundle>=1.6",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.6",
    "loguru>=0.7",
    # 窗口层用它读默认帧缓冲（`window.read_frame()`，12 §12.2 的窗口路径）。
    # 它目前是 imgui-bundle 的传递依赖——**显式写出来**：靠传递依赖等于把别人的
    # 依赖表当成自己的契约，对方哪天不装了，坏的是我们这条"判画面对不对"的路径。
    "pyopengl>=3.1",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
forge-viewer = "forge_viewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_viewer"]

[tool.hatch.build]
artifacts = ["src/forge_viewer/render/forge/shaders/*.glsl"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # 行宽交给 formatter
    "B008",
    "RUF001",  # 中文注释里的全角标点不是笔误
    "RUF002",
    "RUF003",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# GPU / 真实物理世界的用例默认不收集（见 12-verification.md §12.6）
addopts = "-m 'not gpu and not physics' --strict-markers"
markers = [
    "gpu: 需要能创建 GL 上下文的机器",
    "physics: 需要装了物理库并能建真实世界",
    "golden: 基准图回归",
    "slow: 慢用例",
]
