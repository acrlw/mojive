[project]
name = "mojive"
version = "0.1.0"
description = "Backend-neutral 3D viewer and renderer for robotics and simulation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "moderngl>=5.10",
    "glfw>=2.7",
    "imgui-bundle==1.92.900",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.6",
    "loguru>=0.7",
    # window.read_frame() reads the default framebuffer through PyOpenGL.
    "pyopengl>=3.1",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]
native = ["cmake>=3.24", "ninja>=1.11"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
]

[project.scripts]
mojive = "mojive.cli:main"

[project.urls]
Repository = "https://github.com/acrlw/mojive"
Issues = "https://github.com/acrlw/mojive/issues"

[build-system]
requires = ["hatchling", "editables>=0.6"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python"]
sources = { "python" = "mojive" }
# Bypass Hatch's prefix-rename detection; the hook installs the lazy package shim.
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "python/tools/build_hook.py"

[tool.hatch.build.targets.wheel.force-include]
"assets" = "mojive/data/assets"

[tool.hatch.build]
artifacts = [
    "python/ui/icon_presets.json",
    "python/render/opengl/shaders/*.glsl",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # Formatter controls line length.
    "B008",
    "RUF001",  # Intentional Unicode UI glyphs and symbols.
    "RUF002",
    "RUF003",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["mojive"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["native"]
# The default suite excludes real GPU and physics worlds.
addopts = "-m 'not gpu and not physics' --strict-markers"
markers = [
    "integration: crosses module, process, serialization, or file-format boundaries",
    "gpu: requires a real GPU device or graphics context",
    "physics: requires an installed physics engine and a live world",
    "golden: compares rendered output with reviewed reference images",
    "slow: runs an extended workload",
]
