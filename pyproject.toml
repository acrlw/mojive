[project]
name = "forge-viewer"
version = "0.1.0"
description = "Interactive 3D viewer and OpenGL renderer for robotics and simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "moderngl>=5.10",
    "glfw>=2.7",
    "imgui-bundle>=1.6",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.6",
    "loguru>=0.7",
    # window.read_frame() reads the default framebuffer through PyOpenGL.
    "pyopengl>=3.1",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
forge-viewer = "forge_viewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_viewer"]

[tool.hatch.build]
artifacts = ["src/forge_viewer/render/forge/shaders/*.glsl"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # Formatter controls line length.
    "B008",
    "RUF001",  # Intentional Unicode UI glyphs and symbols.
    "RUF002",
    "RUF003",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite excludes real GPU and physics worlds.
addopts = "-m 'not gpu and not physics' --strict-markers"
markers = [
    "gpu: requires a real OpenGL context",
    "physics: requires an installed physics engine and a live world",
    "golden: compares rendered output with reviewed reference images",
    "slow: runs an extended workload",
]
