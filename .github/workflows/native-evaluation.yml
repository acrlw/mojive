name: Native backend evaluation
on:
  push:
    branches: [codex/bgfx-cpp-evaluation]
    paths: ["native/**", ".github/workflows/native-evaluation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies and software Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libgl1-mesa-dev mesa-vulkan-drivers xvfb
      - name: Windows DXIL compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip -OutFile "$env:RUNNER_TEMP/dxc.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/dxc.zip" -Algorithm SHA256).Hash.ToLower() -ne 'a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241') { throw 'DXC checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/dxc.zip" "$env:RUNNER_TEMP/dxc"
          "$env:RUNNER_TEMP/dxc/bin/x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        run: cmake -S native -B output/native-ci -DCMAKE_BUILD_TYPE=Release -DMOJIVE_BUILD_SDL=ON -DMOJIVE_BUILD_BGFX=ON
      - name: Build both adapters and all shaders
        run: cmake --build output/native-ci --config Release --parallel 4
      - name: Common contract tests
        run: ctest --test-dir output/native-ci -C Release --output-on-failure
      - name: Vulkan software conformance
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a output/native-ci/mojive_native_probe output/native-ci/shaders output/conformance/bgfx bgfx
          xvfb-run -a output/native-ci/mojive_native_probe output/native-ci/shaders output/conformance/sdl sdl
          xvfb-run -a output/native-ci/mojive_native_composition output/native-ci/shaders output/composition/bgfx bgfx
          xvfb-run -a output/native-ci/mojive_native_composition output/native-ci/shaders output/composition/sdl sdl
      - name: D3D12 conformance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & output/native-ci/Release/mojive_native_probe.exe output/native-ci/shaders output/conformance/bgfx bgfx
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & output/native-ci/Release/mojive_native_probe.exe output/native-ci/shaders output/conformance/sdl sdl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & output/native-ci/Release/mojive_native_composition.exe output/native-ci/shaders output/composition/bgfx bgfx
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & output/native-ci/Release/mojive_native_composition.exe output/native-ci/shaders output/composition/sdl sdl
          exit $LASTEXITCODE
      - name: Save test products and portable shader artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: |
            output/conformance/
            output/composition/
            output/native-ci/shaders/
            output/native-ci/Testing/Temporary/
          if-no-files-found: warn
